name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: lint · build · test
    runs-on: ubuntu-latest

    # e2e는 실제 PostgreSQL·Redis를 쓴다 (로컬 docker compose와 동일 구성).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pacer
          POSTGRES_PASSWORD: pacer
          POSTGRES_DB: pacer
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pacer -d pacer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://pacer:pacer@localhost:5432/pacer
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Migrate + seed
        run: |
          npm run migration:run
          npm run db:seed

      - name: E2E tests
        run: npm run test:e2e

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 운영 이미지가 깨지지 않는지만 확인한다(푸시는 하지 않음).
      - name: Build image
        run: docker build -t pacer-server:ci .
